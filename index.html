<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Karen's Garden">
  <meta name="theme-color" id="themeColorMeta" content="#ffffff">
  <title>Karen's Garden</title>
  <link rel="manifest" id="manifestLink">
  <style>
    :root {
      --bg: #f5f5f5; --surface: #ffffff; --text: #1a1a1a; --text-muted: #888;
      --border: #e0e0e8; --accent: #e94560; --btn-bg: #eeeef6; --btn-hover: #e2e2ee;
    }
    [data-theme="dark"] {
      --bg: #1a1a2e; --surface: #16213e; --text: #e0e0e0; --text-muted: #777;
      --border: #2a2a4a; --btn-bg: #252548; --btn-hover: #353568;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100dvh; display: flex; flex-direction: column; align-items: center;
      transition: background 0.2s, color 0.2s;
    }
    header {
      width: 100%; max-width: 480px;
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px 20px 0;
    }
    .logo { display: flex; flex-direction: column; }
    .logo-name  { font-size: 1.45rem; font-weight: 900; letter-spacing: 3px; color: var(--text); line-height: 1; }
    .logo-sub   { font-size: 0.62rem; letter-spacing: 3px; color: var(--accent); font-weight: 700; text-transform: uppercase; margin-top: 3px; }
    .icon-btn {
      background: var(--btn-bg); border: none; color: var(--text);
      width: 36px; height: 36px; border-radius: 10px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; transition: background 0.2s;
    }
    .icon-btn:hover { background: var(--btn-hover); }
    main {
      width: 100%; max-width: 480px; flex: 1;
      padding: 28px 20px 32px; display: flex; flex-direction: column; gap: 14px;
    }
    .section-label { font-size: 0.65rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; padding-left: 2px; }
    .game-card {
      display: flex; align-items: center; gap: 16px;
      background: var(--surface); border-radius: 18px; padding: 18px 20px;
      text-decoration: none; color: var(--text);
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      border: 1.5px solid var(--border);
      transition: transform 0.14s, box-shadow 0.14s;
      cursor: pointer;
    }
    .game-card:hover  { transform: translateY(-2px); box-shadow: 0 6px 22px rgba(0,0,0,0.12); }
    .game-card:active { transform: scale(0.98); }
    .game-icon { font-size: 2.4rem; line-height: 1; flex-shrink: 0; width: 52px; text-align: center; }
    .game-info { flex: 1; min-width: 0; }
    .game-name { font-size: 1.05rem; font-weight: 800; letter-spacing: 1px; }
    .game-desc { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
    .game-stat { font-size: 0.72rem; font-weight: 600; color: var(--accent); margin-top: 5px; }
    .game-arrow { font-size: 1.1rem; color: var(--text-muted); flex-shrink: 0; }
    .coming-soon { opacity: 0.5; cursor: default; }
    .coming-soon:hover { transform: none; box-shadow: 0 2px 12px rgba(0,0,0,0.07); }
    .badge {
      background: var(--accent); color: #fff;
      font-size: 0.55rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase;
      padding: 2px 7px; border-radius: 20px; flex-shrink: 0;
    }
    .badge.soon { background: var(--btn-bg); color: var(--text-muted); }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <span class="logo-name">KAREN'S GARDEN</span>
      <span class="logo-sub">Puzzle Hub</span>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">☀️</button>
  </header>

  <main>
    <div class="section-label">Games</div>

    <a href="sudoku.html" class="game-card">
      <div class="game-icon">🧩</div>
      <div class="game-info">
        <div class="game-name">SUDOKU</div>
        <div class="game-desc">Fill the 9×9 grid — unique solution guaranteed</div>
        <div class="game-stat" id="sudokuStat"></div>
      </div>
      <div class="game-arrow">›</div>
    </a>

    <a href="wordle.html" class="game-card">
      <div class="game-icon">🌿</div>
      <div class="game-info">
        <div class="game-name">WORDLE</div>
        <div class="game-desc">Guess the 5-letter word in 6 tries</div>
        <div class="game-stat" id="wordleStat"></div>
      </div>
      <div class="game-arrow">›</div>
    </a>
  </main>

  <script>
  (function(){
    const icon=`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='14' fill='%23e94560'/><text x='50' y='68' font-size='58' text-anchor='middle' fill='%23fff'>🌸</text></svg>`;
    const m={name:"Karen's Garden",short_name:"Garden",start_url:"./",display:"standalone",background_color:"#ffffff",theme_color:"#e94560",icons:[{src:`data:image/svg+xml,${icon}`,sizes:"any",type:"image/svg+xml",purpose:"any maskable"}]};
    document.getElementById('manifestLink').href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));
    if('serviceWorker' in navigator){
      const sw=`const C='kg-v3';self.addEventListener('install',e=>{self.skipWaiting();e.waitUntil(caches.open(C).then(c=>c.addAll(['./','./sudoku.html','./wordle.html','./words.txt'])));});self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==C).map(k=>caches.delete(k)))).then(()=>self.clients.claim()));});self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{const cl=res.clone();caches.open(C).then(c=>c.put(e.request,cl));return res;})));});`;
      navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'application/javascript'}))).catch(()=>{});
    }
  })();

  function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}

  // Sudoku stat
  const sb=JSON.parse(localStorage.getItem('kg_sudoku_best')||'{}');
  const sbEntries=Object.entries(sb);
  if(sbEntries.length){
    const best=sbEntries.sort((a,b)=>a[1]-b[1])[0];
    document.getElementById('sudokuStat').textContent='⏱ Best: '+fmt(best[1])+' ('+best[0]+')';
  }

  // Wordle stat
  const ws=JSON.parse(localStorage.getItem('kg_wordle_stats')||'{}');
  if(ws.played){
    const pct=Math.round(ws.won/ws.played*100);
    document.getElementById('wordleStat').textContent=`🏆 ${ws.won}/${ws.played} wins · ${pct}% · Streak: ${ws.streak}`;
  }

  // Theme
  let isDark=false;document.documentElement.dataset.theme='light';
  document.getElementById('themeBtn').addEventListener('click',()=>{
    isDark=!isDark;document.documentElement.dataset.theme=isDark?'dark':'light';
    document.getElementById('themeBtn').textContent=isDark?'🌙':'☀️';
    document.getElementById('themeColorMeta').content=isDark?'#1a1a2e':'#ffffff';
  });
  </script>
</body>
</html>
